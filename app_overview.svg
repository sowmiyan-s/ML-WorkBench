<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .node { fill: #4CAF50; }
      .link { stroke: #ddd; stroke-width: 2; }
      .pulse { animation: pulse 2s infinite; }
      @keyframes pulse {
        0% { r: 5; opacity: 0.5; }
        50% { r: 8; opacity: 1; }
        100% { r: 5; opacity: 0.5; }
      }
      .flow { animation: flow 3s linear infinite; }
      @keyframes flow {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
      text { font-family: sans-serif; fill: #333; }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f9f9f9" rx="15" />

  <!-- Title -->
  <text x="50%" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="url(#grad1)">ML Workbench</text>
  <text x="50%" y="80" text-anchor="middle" font-size="14" fill="#666">Data Analysis & Machine Learning Pipeline</text>

  <!-- Nodes and Links -->
  <g transform="translate(100, 150)">
    <!-- Input Node -->
    <circle cx="0" cy="50" r="20" fill="#2196F3" />
    <text x="0" y="90" text-anchor="middle" font-size="12">Data Input</text>

    <!-- Processing Nodes -->
    <circle cx="150" cy="20" r="15" class="node pulse" />
    <circle cx="150" cy="80" r="15" class="node pulse" style="animation-delay: 0.5s" />
    
    <!-- Model Node -->
    <rect x="280" y="20" width="60" height="60" rx="5" fill="#FF9800" />
    <text x="310" y="55" text-anchor="middle" fill="white" font-size="12">Model</text>

    <!-- Output Node -->
    <circle cx="450" cy="50" r="20" fill="#9C27B0" />
    <text x="450" y="90" text-anchor="middle" font-size="12">Prediction</text>

    <!-- Links -->
    <line x1="20" y1="50" x2="135" y2="20" class="link" />
    <line x1="20" y1="50" x2="135" y2="80" class="link" />
    <line x1="165" y1="20" x2="280" y2="40" class="link" />
    <line x1="165" y1="80" x2="280" y2="60" class="link" />
    <line x1="340" y1="50" x2="430" y2="50" class="link" stroke-dasharray="5,5" class="flow" />
  </g>

  <!-- Animated Data Packets -->
  <circle r="4" fill="#2196F3">
    <animateMotion path="M120,200 L235,170" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#2196F3">
    <animateMotion path="M120,200 L235,230" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>
   <circle r="4" fill="#FF9800">
    <animateMotion path="M440,200 L530,200" dur="2s" begin="1.5s" repeatCount="indefinite" />
  </circle>

</svg>
